# InfoRadar 監視ソース定義
#
# categories[].feeds[] の各エントリ:
#   name:         表示名
#   url:          RSS/Atom フィードURL または HTMLページURL（ローカルパスも可・テスト用）
#   type:         省略時 rss。RSS非提供サイトは html（リンク出現＝新着とみなす）
#   link_pattern: type: html のとき必須。記事リンクを絞り込む正規表現（絶対URLに適用）
#   keywords:     任意。マッチした記事に ★ を付けて上位に表示（OR条件・部分一致）
#   enabled:      false で一時停止
#
# 注意: 本ファイルのURLは開発サンドボックスから疎通確認できていません（初回の
# GitHub Actions 実行レポートで取得可否を確認し、失敗ソースは修正してください）。

global_keywords:
  - 定期券
  - MaaS
  - 行動変容
  - 二地域居住
  - コンパクトシティ
  - 地域公共交通

categories:
  - name: 交通・都市・行動創出
    feeds:
      - name: 国土交通省 報道発表
        url: https://www.mlit.go.jp/pressrelease.rdf
        keywords: [公共交通, まちづくり, 健康, 団地]
      - name: 国土交通省 新着情報
        url: https://www.mlit.go.jp/index.rdf
      - name: 日本都市計画学会
        url: https://www.cpij.or.jp/feed/
      - name: JR東日本 プレスリリース
        type: html
        url: https://www.jreast.co.jp/press/
        link_pattern: "/press/20"
        keywords: [定期券, ポイント, Suica, コールセンター]
      # link_pattern 未確定（初回実行で構造確認後に追加）:
      # - グッドデザイン賞 https://www.g-mark.org/
      # - JR九州ニュースリリース https://www.jrkyushu.co.jp/news/

  - name: 競合・自社動向
    feeds:
      - name: PKSHA Technology
        url: https://www.pksha.com/feed/
        keywords: [FAQ, コールセンター, チャットボット]
      - name: JR西日本 ニュースリリース
        type: html
        url: https://www.westjr.co.jp/press/
        link_pattern: "/press/article/"
        keywords: [WESTER, ICOCA, 定期券]
      # link_pattern 未確定（初回実行で構造確認後に追加）:
      # - Helpfeel https://www.helpfeel.com/
