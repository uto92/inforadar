name: InfoRadar

on:
  schedule:
    - cron: "30 22 * * *" # 毎朝 07:30 JST
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["inforadar.py", "tests/**", "requirements*.txt", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: inforadar
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  radar:
    needs: test
    # スケジュール実行と手動実行のみレーダーを回す（push検証では走らせない）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run InfoRadar
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python inforadar.py --notify | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit state & report
        run: |
          git config user.name "inforadar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json reports/
          if ! git diff --cached --quiet; then
            git commit -m "radar: $(date +%Y-%m-%d) の実行結果"
            git push
          fi
