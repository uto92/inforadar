<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JR西日本 主要駅 混雑ヒートマップ</title>
<link href="lib/maplibre-gl.css" rel="stylesheet" />
<script src="lib/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(15, 17, 22, 0.82); color: #e8e8e8;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 12px 14px; width: 300px;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    backdrop-filter: blur(6px);
  }
  .panel h1 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
  .panel .sub { margin: 0 0 10px; font-size: 11px; color: #9aa0a8; line-height: 1.5; }

  .controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  button.play {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    background: #e8503a; color: #fff; font-size: 14px; flex: none;
  }
  button.play:hover { background: #ff6a52; }
  input[type=range] { flex: 1; accent-color: #e8503a; }
  select.speed {
    background: #22252c; color: #ddd; border: 1px solid #444; border-radius: 6px;
    font-size: 11px; padding: 3px 4px;
  }

  .areas { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .areas button {
    background: #22252c; color: #cfd3d8; border: 1px solid #3a3e46; border-radius: 999px;
    font-size: 11px; padding: 3px 9px; cursor: pointer;
  }
  .areas button:hover, .areas button.active { background: #3a3e46; color: #fff; }

  .modes { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; font-size: 11px; color: #9aa0a8; }
  .modes button {
    background: #22252c; color: #cfd3d8; border: 1px solid #3a3e46; border-radius: 6px;
    font-size: 11px; padding: 3px 9px; cursor: pointer;
  }
  .modes button.active { background: #e8503a; border-color: #e8503a; color: #fff; }
  .modes button:disabled { opacity: 0.4; cursor: not-allowed; }
  .source { font-size: 10px; color: #9aa0a8; margin: 0 0 8px; line-height: 1.5; }
  .source.warn { color: #f0b24a; }

  .legend { font-size: 10px; color: #9aa0a8; }
  .legend .bar {
    height: 8px; border-radius: 4px; margin: 4px 0 2px;
    background: linear-gradient(to right,
      rgba(0,200,120,0.15), rgba(80,220,100,0.6), #ffe14d, #ff9a1f, #e8281e);
  }
  .legend .labels { display: flex; justify-content: space-between; }

  .clock {
    position: absolute; right: 18px; bottom: 28px; z-index: 10;
    color: #fff; font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 52px; font-weight: 700; letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
  }
  .clock .day { display: block; font-size: 13px; font-weight: 400; text-align: right; color: #cfd3d8; }

  .station-label {
    color: rgba(230,232,236,0.85); font-size: 10px; white-space: nowrap;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    text-shadow: 0 0 4px #000, 0 0 4px #000; pointer-events: none;
    transform: translateY(-14px);
  }

  .tooltip {
    position: absolute; z-index: 20; pointer-events: none; display: none;
    background: rgba(15,17,22,0.92); color: #eee; font-size: 11px;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px 8px;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .tooltip b { font-size: 12px; }

  /* ---------- ビュー切替 ---------- */
  .viewbar {
    position: absolute; top: 12px; right: 52px; z-index: 40;
    display: flex; border-radius: 8px; overflow: hidden;
    border: 1px solid #3a3e46;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .viewbar button {
    background: rgba(15,17,22,0.85); color: #cfd3d8; border: none;
    font-size: 12px; padding: 7px 14px; cursor: pointer;
  }
  .viewbar button.active { background: #e8503a; color: #fff; }
  .hidden { display: none !important; }

  /* ---------- グラフ(マトリクス)ビュー ---------- */
  #matrixView {
    position: absolute; inset: 0; z-index: 30; display: none;
    overflow-y: auto; background: #101318; color: #e6e8ec;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  #matrixView.active { display: block; }
  .mx-inner { max-width: 1180px; margin: 0 auto; padding: 18px 20px 48px; }
  .mx-head h1 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
  .mx-head p { margin: 0 0 14px; font-size: 11px; color: #9aa0a8; line-height: 1.6; max-width: 720px; }
  .mx-controls {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px;
    font-size: 11px; color: #9aa0a8;
  }
  .mx-seg { display: flex; border: 1px solid #3a3e46; border-radius: 6px; overflow: hidden; }
  .mx-seg button {
    background: #1a1e25; color: #cfd3d8; border: none; font-size: 11px;
    padding: 4px 11px; cursor: pointer;
  }
  .mx-seg button.active { background: #e8503a; color: #fff; }
  .mx-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .mx-legend { display: inline-flex; align-items: center; gap: 6px; }
  .mx-legend .bar { width: 120px; height: 8px; border-radius: 4px; }
  .mx-layout { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .mx-gridwrap { flex: 1 1 620px; min-width: 0; overflow-x: auto; }
  .mx-grid { display: grid; gap: 2px; min-width: 660px; }
  .mx-group {
    grid-column: 1 / -1; font-size: 11px; font-weight: 700; color: #9aa0a8;
    letter-spacing: 0.08em; padding: 14px 0 2px;
  }
  .mx-hrow { display: contents; }
  .mx-hcell { font-size: 9px; color: #7c828c; text-align: center; padding-bottom: 1px; }
  .mx-name {
    font-size: 11px; color: #cfd3d8; text-align: right; padding-right: 8px;
    display: flex; align-items: center; justify-content: flex-end;
    background: none; border: none; cursor: pointer; font-family: inherit;
    border-radius: 4px;
  }
  .mx-name:hover { color: #fff; background: #1c212a; }
  .mx-name.selected { color: #ff8a70; font-weight: 700; }
  .mx-name:focus-visible { outline: 2px solid #e8503a; outline-offset: 1px; }
  .mx-cell {
    height: 20px; border-radius: 3px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-variant-numeric: tabular-nums;
  }
  .mx-cell:hover { outline: 2px solid rgba(255,255,255,0.75); outline-offset: -1px; }
  .mx-detail {
    flex: 0 0 330px; position: sticky; top: 18px;
    background: #151920; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 14px 16px;
  }
  .mx-detail h2 { margin: 0 0 2px; font-size: 15px; }
  .mx-detail .meta { font-size: 11px; color: #9aa0a8; margin: 0 0 10px; }
  .mx-detail .stats { display: flex; gap: 18px; margin: 0 0 8px; }
  .mx-detail .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .mx-detail .stat span { font-size: 10px; color: #9aa0a8; }
  .mx-detail .chart-legend { display: flex; gap: 14px; font-size: 10px; color: #9aa0a8; margin-top: 6px; }
  .mx-detail .chart-legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin-right: 4px; vertical-align: middle; }
  .mx-note { font-size: 10px; color: #7c828c; margin-top: 10px; line-height: 1.6; }

  @media (max-width: 640px) {
    .panel { width: calc(100% - 48px); }
    .clock { font-size: 36px; bottom: 16px; }
    .mx-detail { position: static; flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>JR西日本 主要駅 混雑ヒートマップ</h1>
  <p class="sub">朝5時〜深夜0時の駅周辺の混雑をヒートマップ表示。「推定モデル」は乗車人員×時間帯モデルによる推定値、「実データ」は国交省 全国の人流オープンデータ(1kmメッシュ滞在人口)によります。</p>
  <div class="controls">
    <button id="playBtn" class="play" title="再生/停止">&#9654;</button>
    <input id="timeSlider" type="range" min="300" max="1499" step="1" value="480" />
    <select id="speedSel" class="speed" title="再生速度">
      <option value="10">×10</option>
      <option value="20" selected>×20</option>
      <option value="45">×45</option>
      <option value="90">×90</option>
    </select>
  </div>
  <div class="modes">
    データ:
    <button id="modeModel" class="active">推定モデル</button>
    <button id="modeMesh">実データ</button>
    <span id="dayTypeWrap" style="display:none">
      <button id="dayW" class="active">平日</button>
      <button id="dayH">休日</button>
    </span>
  </div>
  <p class="source" id="sourceLine"></p>
  <div class="areas" id="areaBtns"></div>
  <div class="legend">
    混雑度(相対値)
    <div class="bar"></div>
    <div class="labels"><span>少</span><span>多</span></div>
  </div>
</div>

<div class="clock"><span class="day">平日イメージ</span><span id="clockText">8:00</span></div>
<div class="tooltip" id="tooltip"></div>

<div class="viewbar">
  <button id="viewMapBtn" class="active">マップ</button>
  <button id="viewGraphBtn">グラフ</button>
</div>

<div id="matrixView">
  <div class="mx-inner">
    <div class="mx-head">
      <h1>JR西日本 主要駅 混雑パターン(駅×時間帯)</h1>
      <p>各セルは5時台〜24時台の混雑指数(駅別乗車人員×駅タイプ別の時間帯モデルによる推定値)。駅名をクリックすると右に日内カーブを表示します。</p>
    </div>
    <div class="mx-controls">
      <span>正規化:</span>
      <span class="mx-seg">
        <button id="mxNormRow" class="active">駅ごと(パターン比較)</button>
        <button id="mxNormAbs">全体(規模込み)</button>
      </span>
      <label class="mx-check"><input type="checkbox" id="mxNums"> 数値を表示</label>
      <span class="mx-legend">少 <span class="bar" id="mxLegendBar"></span> 多</span>
    </div>
    <div class="mx-layout">
      <div class="mx-gridwrap"><div class="mx-grid" id="mxGrid"></div></div>
      <aside class="mx-detail" id="mxDetail"></aside>
    </div>
  </div>
</div>

<script src="data/stations.js"></script>
<script src="data/rail_lines.js"></script>
<script src="data/flow_mesh.js"></script> <!-- 無ければ404になるだけで推定モードで動く -->
<script>
"use strict";

// ---------- 乱数(シード付き・再現可能) ----------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) { // Box–Muller
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// ---------- 駅ごとの点群を生成 ----------
// 駅の周囲に「人だまり」を散らし、Agoop風の有機的なにじみを作る
const MAX_PAX = Math.max(...STATIONS.map(s => s.passengers));
const points = []; // { lon, lat, station, share, phase, freq }

STATIONS.forEach((st, si) => {
  const rnd = mulberry32(1000 + si * 7919);
  const stationW = Math.pow(st.passengers / MAX_PAX, 0.55); // 差が付きすぎないよう緩和
  const n = Math.max(14, Math.min(120, Math.round(Math.sqrt(st.passengers) / 6)));

  // 中心のほかにサブクラスタ(駅前の別の人だまり)を数個
  const clusters = [{ dx: 0, dy: 0, w: 0.55 }];
  const nSub = 2 + Math.floor(rnd() * 3);
  for (let c = 0; c < nSub; c++) {
    clusters.push({
      dx: gauss(rnd) * st.spread * 0.9,
      dy: gauss(rnd) * st.spread * 0.9,
      w: 0.45 / nSub,
    });
  }

  const mPerDegLat = 111320;
  const mPerDegLon = 111320 * Math.cos(st.lat * Math.PI / 180);

  for (let i = 0; i < n; i++) {
    // クラスタを重みで選択
    let r = rnd(), cl = clusters[0];
    for (const c of clusters) { r -= c.w; if (r <= 0) { cl = c; break; } }
    const dx = cl.dx + gauss(rnd) * st.spread * 0.45;
    const dy = cl.dy + gauss(rnd) * st.spread * 0.45;
    points.push({
      lon: st.lon + dx / mPerDegLon,
      lat: st.lat + dy / mPerDegLat,
      base: stationW / n * (0.5 + rnd()),
      station: st,
      phase: rnd() * Math.PI * 2,
      freq: 0.5 + rnd() * 1.5,
    });
  }
});

// ---------- 時間帯の重み ----------
function stationProfileAt(st, minutes) {
  // minutes: 300(5:00)〜1499(24:59)
  const hf = minutes / 60 - 5;                  // 0〜19.98
  const i0 = Math.max(0, Math.min(19, Math.floor(hf)));
  const i1 = Math.min(19, i0 + 1);
  const f = hf - i0;
  let v = 0;
  for (const [key, w] of Object.entries(st.profile)) {
    const p = HOURLY_PROFILES[key];
    v += w * (p[i0] * (1 - f) + p[i1] * f);
  }
  return v;
}

// ---------- 実データ(1kmメッシュ)モード ----------
const hasMesh = typeof FLOW_MESH !== "undefined" && FLOW_MESH.cells && FLOW_MESH.cells.length > 0;
let mode = "model";   // "model" | "mesh"
let dayType = "w";    // "w"=平日 | "h"=休日
const meshMax = hasMesh
  ? Math.max(...FLOW_MESH.cells.map(c => Math.max(c.wd, c.wn, c.hd, c.hn)))
  : 1;

// 実測は昼(11-15時)と深夜(1-5時)の2時点のみ。その間は日周カーブで補間する
// (2:30に深夜値、14:30に昼値となる余弦カーブ)
function dayCurve(minutes) {
  const h = minutes / 60;
  return 0.5 - 0.5 * Math.cos(2 * Math.PI * (h - 2.5) / 24);
}
function meshPopAt(cell, minutes) {
  const d = dayType === "w" ? cell.wd : cell.hd;
  const n = dayType === "w" ? cell.wn : cell.hn;
  return n + (d - n) * dayCurve(minutes);
}

function buildMeshGeoJSON(minutes) {
  const features = FLOW_MESH.cells.map(c => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: [c.lon, c.lat] },
    properties: { w: Math.pow(Math.max(0, meshPopAt(c, minutes)) / meshMax, 0.7) * 0.24 },
  }));
  return { type: "FeatureCollection", features };
}

// ヒートマップ半径: 推定モードは見た目優先、メッシュモードは実距離(約1.4km)に追従
const RADIUS_MODEL = ["interpolate", ["exponential", 1.6], ["zoom"], 6, 7, 9, 16, 11, 34, 13, 70];
const RADIUS_MESH = ["interpolate", ["exponential", 2], ["zoom"], 6, 3, 9, 11, 11, 44, 13, 178];
const INTENSITY_MODEL = ["interpolate", ["linear"], ["zoom"], 6, 5, 9, 8, 11, 14, 13, 22];
// メッシュモードは半径がズームに追従する(重なり具合が一定)ため強度も一定でよい
const INTENSITY_MESH = 9;
function applyModePaint() {
  if (!map.getLayer("crowd-heat")) return;
  map.setPaintProperty("crowd-heat", "heatmap-radius", mode === "mesh" ? RADIUS_MESH : RADIUS_MODEL);
  map.setPaintProperty("crowd-heat", "heatmap-intensity", mode === "mesh" ? INTENSITY_MESH : INTENSITY_MODEL);
}

function buildGeoJSON(minutes) {
  if (mode === "mesh") return buildMeshGeoJSON(minutes);
  return buildModelGeoJSON(minutes);
}

function buildModelGeoJSON(minutes) {
  const t = minutes / 60;
  const features = new Array(points.length);
  // 駅ごとのプロファイル値はキャッシュ
  const cache = new Map();
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    let prof = cache.get(p.station);
    if (prof === undefined) { prof = stationProfileAt(p.station, minutes); cache.set(p.station, prof); }
    // 点ごとにゆらぎを加えて有機的に
    const noise = 0.72 + 0.28 * Math.sin(t * p.freq * 2.2 + p.phase);
    features[i] = {
      type: "Feature",
      geometry: { type: "Point", coordinates: [p.lon, p.lat] },
      properties: { w: p.base * prof * noise },
    };
  }
  return { type: "FeatureCollection", features };
}

// ---------- 地図 ----------
// window.__NO_BASEMAP__ を立てると外部タイルを使わない簡易表示になる
// (オフライン利用や、外部通信が制限された環境への埋め込み用)
const BASE_STYLE = window.__NO_BASEMAP__
  ? {
      version: 8,
      sources: {},
      layers: [{ id: "bg", type: "background", paint: { "background-color": "#14171d" } }],
    }
  : {
      version: 8,
      sources: {
        carto: {
          type: "raster",
          tiles: [
            "https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
            "https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
            "https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png",
          ],
          tileSize: 256,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        },
      },
      layers: [{ id: "carto", type: "raster", source: "carto" }],
    };

const map = new maplibregl.Map({
  container: "map",
  style: BASE_STYLE,
  center: AREA_VIEWS[0].center,
  zoom: AREA_VIEWS[0].zoom,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

let currentMinutes = 480; // 8:00 スタート

// "load" はタイル取得完了まで待つため、タイルが遅い/取れない環境でも
// 先にヒートマップを出せる "style.load" でレイヤーを追加する
map.on("style.load", () => {
  // JR路線の白いライン(ヒートマップの下に描画)
  if (typeof RAIL_LINES !== "undefined") {
    map.addSource("rail", {
      type: "geojson",
      data: {
        type: "FeatureCollection",
        features: RAIL_LINES.map(l => ({
          type: "Feature",
          geometry: { type: "LineString", coordinates: l.coords },
          properties: { name: l.name },
        })),
      },
    });
    map.addLayer({
      id: "rail-line",
      type: "line",
      source: "rail",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: {
        "line-color": "#dfe4ea",
        "line-opacity": window.__NO_BASEMAP__ ? 0.55 : 0.35,
        "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 6, 0.8, 9, 1.6, 12, 3.2],
      },
    });
  }
  map.addSource("crowd", { type: "geojson", data: buildGeoJSON(currentMinutes) });
  map.addLayer({
    id: "crowd-heat",
    type: "heatmap",
    source: "crowd",
    paint: {
      "heatmap-weight": ["get", "w"],
      "heatmap-intensity": INTENSITY_MODEL,
      "heatmap-radius": RADIUS_MODEL,
      "heatmap-color": [
        "interpolate", ["linear"], ["heatmap-density"],
        0.00, "rgba(0, 0, 0, 0)",
        0.12, "rgba(30, 160, 110, 0.28)",
        0.30, "rgba(110, 210, 90, 0.55)",
        0.50, "rgba(255, 225, 77, 0.80)",
        0.72, "rgba(255, 154, 31, 0.90)",
        0.90, "rgba(232, 40, 30, 0.95)",
        1.00, "rgba(255, 70, 60, 1)",
      ],
      "heatmap-opacity": 0.95,
    },
  });
  applyModePaint();
  render(currentMinutes);
  window.__ready = true;
});

// ---------- 駅名ラベル + ツールチップ(HTMLマーカー: CJKフォント問題を回避) ----------
const labelEls = [];
STATIONS.forEach(st => {
  const el = document.createElement("div");
  el.className = "station-label";
  el.textContent = st.name;
  new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([st.lon, st.lat]).addTo(map);
  labelEls.push(el);
});
function updateLabelVisibility() {
  const show = map.getZoom() >= 9.2;
  labelEls.forEach(el => { el.style.display = show ? "" : "none"; });
}
map.on("zoom", updateLabelVisibility);
updateLabelVisibility();

const tooltip = document.getElementById("tooltip");
map.on("mousemove", e => {
  // 最寄り駅(画面距離60px以内)を表示
  let best = null, bestD = 60;
  for (const st of STATIONS) {
    const p = map.project([st.lon, st.lat]);
    const d = Math.hypot(p.x - e.point.x, p.y - e.point.y);
    if (d < bestD) { bestD = d; best = st; }
  }
  if (best) {
    tooltip.style.display = "block";
    tooltip.style.left = (e.point.x + 14) + "px";
    tooltip.style.top = (e.point.y + 14) + "px";
    if (mode === "mesh") {
      // 駅から1.2km以内のメッシュの滞在人口(現在時刻の補間値)合計
      let sum = 0;
      for (const c of FLOW_MESH.cells) {
        const dx = (c.lon - best.lon) * 111.32 * Math.cos(best.lat * Math.PI / 180);
        const dy = (c.lat - best.lat) * 111.32;
        if (dx * dx + dy * dy <= 1.2 * 1.2) sum += meshPopAt(c, currentMinutes);
      }
      tooltip.innerHTML = `<b>${best.name}</b><br>周辺約1km圏の推定滞在人口: ${Math.round(sum).toLocaleString()}人<br><span style="color:#9aa0a8">(昼・深夜の実測値を時刻補間)</span>`;
    } else {
      const rel = Math.round(stationProfileAt(best, currentMinutes) * 100);
      tooltip.innerHTML = `<b>${best.name}</b><br>乗車人員 約${best.passengers.toLocaleString()}人/日<br>この時間帯の推定混雑度: ${rel}%`;
    }
  } else {
    tooltip.style.display = "none";
  }
});

// ---------- 再生コントロール ----------
const playBtn = document.getElementById("playBtn");
const slider = document.getElementById("timeSlider");
const speedSel = document.getElementById("speedSel");
const clockText = document.getElementById("clockText");

let playing = false;
let lastTs = null;

function fmtTime(minutes) {
  const h = Math.floor(minutes / 60);
  const m = Math.floor(minutes % 60);
  return h + ":" + String(m).padStart(2, "0");
}

function render(minutes) {
  currentMinutes = minutes;
  slider.value = Math.round(minutes);
  clockText.textContent = fmtTime(minutes);
  const src = map.getSource("crowd");
  if (src) src.setData(buildGeoJSON(minutes));
}

function tick(ts) {
  if (!playing) return;
  if (lastTs !== null) {
    const dt = (ts - lastTs) / 1000;
    let m = currentMinutes + dt * Number(speedSel.value) / 60 * 60; // 実時間1秒 = ×speed 分
    if (m > 1499) m = 300; // ループ
    render(m);
  }
  lastTs = ts;
  requestAnimationFrame(tick);
}

function setPlaying(p) {
  playing = p;
  playBtn.innerHTML = p ? "&#10074;&#10074;" : "&#9654;";
  lastTs = null;
  if (p) requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => setPlaying(!playing));
slider.addEventListener("input", () => { render(Number(slider.value)); });

// ---------- モード切替 ----------
const modeModelBtn = document.getElementById("modeModel");
const modeMeshBtn = document.getElementById("modeMesh");
const dayTypeWrap = document.getElementById("dayTypeWrap");
const dayWBtn = document.getElementById("dayW");
const dayHBtn = document.getElementById("dayH");
const sourceLine = document.getElementById("sourceLine");
const dayLabel = document.querySelector(".clock .day");

function updateModeUI() {
  modeModelBtn.classList.toggle("active", mode === "model");
  modeMeshBtn.classList.toggle("active", mode === "mesh");
  dayTypeWrap.style.display = mode === "mesh" ? "" : "none";
  dayWBtn.classList.toggle("active", dayType === "w");
  dayHBtn.classList.toggle("active", dayType === "h");
  if (mode === "mesh") {
    const meta = FLOW_MESH.meta || {};
    const isSample = meta.source === "synthetic-sample";
    sourceLine.className = isSample ? "source warn" : "source";
    sourceLine.textContent = isSample
      ? "⚠ 合成サンプルデータ表示中(実測値ではありません)。tools/fetch_mlit_flow.py で実データに置き換えられます。"
      : `出典: ${meta.sourceName || "全国の人流オープンデータ(国交省)"}` +
        (meta.months ? `/ 対象: ${meta.months.join(", ")}` : "") +
        "。昼(11-15時)・深夜(1-5時)の実測2時点を時刻で補間しています。";
    dayLabel.textContent = (dayType === "w" ? "平日" : "休日") + (isSample ? "(サンプル)" : "(実データ補間)");
  } else {
    sourceLine.className = "source";
    sourceLine.textContent = "時間帯変動: 駅タイプ別の推定モデル(平日イメージ)";
    dayLabel.textContent = "平日イメージ";
  }
}
if (!hasMesh) {
  modeMeshBtn.disabled = true;
  modeMeshBtn.title = "data/flow_mesh.js がありません(tools/fetch_mlit_flow.py で生成)";
}
modeModelBtn.addEventListener("click", () => { mode = "model"; updateModeUI(); applyModePaint(); render(currentMinutes); });
modeMeshBtn.addEventListener("click", () => { mode = "mesh"; updateModeUI(); applyModePaint(); render(currentMinutes); });
dayWBtn.addEventListener("click", () => { dayType = "w"; updateModeUI(); render(currentMinutes); });
dayHBtn.addEventListener("click", () => { dayType = "h"; updateModeUI(); render(currentMinutes); });
updateModeUI();

// ---------- エリアボタン ----------
const areaBtns = document.getElementById("areaBtns");
AREA_VIEWS.forEach((v, i) => {
  const b = document.createElement("button");
  b.textContent = v.name;
  if (i === 0) b.classList.add("active");
  b.addEventListener("click", () => {
    document.querySelectorAll(".areas button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    map.flyTo({ center: v.center, zoom: v.zoom, duration: 1200 });
  });
  areaBtns.appendChild(b);
});

// ---------- グラフ(マトリクス)ビュー ----------
const HOURS = Array.from({ length: 20 }, (_, i) => i + 5); // 5..24時台

// 明度単調の暖色シーケンシャルランプ(暗→ワイン→赤→橙→黄)
const MX_RAMP = [
  [0.00, [29, 32, 39]],
  [0.15, [58, 31, 56]],
  [0.35, [121, 38, 63]],
  [0.55, [194, 56, 58]],
  [0.75, [238, 124, 51]],
  [0.90, [255, 201, 77]],
  [1.00, [255, 236, 158]],
];
function mxColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < MX_RAMP.length; i++) {
    if (t <= MX_RAMP[i][0]) {
      const [t0, c0] = MX_RAMP[i - 1], [t1, c1] = MX_RAMP[i];
      const f = (t - t0) / (t1 - t0);
      const c = c0.map((v, k) => Math.round(v + (c1[k] - v) * f));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return "rgb(255,236,158)";
}

function mxArea(st) {
  if (st.lat >= 35.6 && st.lon >= 135.9) return "北陸";
  if (st.lat > 35.2 && st.lon < 134.6) return "山陰";
  if (st.lon <= 134.5) return "岡山・広島・山口";
  return "京阪神・近畿";
}

// 混雑指数: 全駅・全時間帯の最大(大阪駅のピーク時)= 100(乗車人員^0.55 × 時間帯モデル)
const mxIndexRaw = (st, h) => Math.pow(st.passengers / MAX_PAX, 0.55) * stationProfileAt(st, h * 60 + 30);
const MX_RAW_MAX = Math.max(...STATIONS.map(st => Math.max(...HOURS.map(h => mxIndexRaw(st, h)))));
const mxIndex = (st, h) => mxIndexRaw(st, h) / MX_RAW_MAX * 100;
const mxRowMax = st => Math.max(...HOURS.map(h => mxIndex(st, h)));
const MX_ABS_MAX = 100;

// 各駅正規化カーブの全駅平均(形の比較用リファレンス)
const MX_AVG_SHAPE = HOURS.map(h =>
  STATIONS.reduce((s, st) => s + mxIndex(st, h) / mxRowMax(st), 0) / STATIONS.length * 100);

let mxNorm = "row";      // "row" | "abs"
let mxShowNums = false;
let mxSelected = STATIONS[0]; // 大阪
let mxBuilt = false;

const MX_GROUPS = ["京阪神・近畿", "岡山・広島・山口", "山陰", "北陸"];

function mxCellValue(st, h) {
  return mxNorm === "row" ? mxIndex(st, h) / mxRowMax(st) * 100 : mxIndex(st, h);
}
function mxCellT(st, h) {
  return mxNorm === "row" ? mxIndex(st, h) / mxRowMax(st) : mxIndex(st, h) / MX_ABS_MAX;
}

function buildMatrix() {
  const grid = document.getElementById("mxGrid");
  grid.style.gridTemplateColumns = `120px repeat(${HOURS.length}, minmax(24px, 1fr))`;
  grid.innerHTML = "";
  for (const group of MX_GROUPS) {
    const members = STATIONS.filter(st => mxArea(st) === group)
      .sort((a, b) => b.passengers - a.passengers);
    if (!members.length) continue;
    const g = document.createElement("div");
    g.className = "mx-group";
    g.textContent = group;
    grid.appendChild(g);
    // 時間ヘッダ(グループごとに繰り返して縦スクロールでも迷わないように)
    const corner = document.createElement("div");
    grid.appendChild(corner);
    for (const h of HOURS) {
      const hc = document.createElement("div");
      hc.className = "mx-hcell";
      hc.textContent = (h % 3 === 0) ? h : "";
      grid.appendChild(hc);
    }
    for (const st of members) {
      const name = document.createElement("button");
      name.className = "mx-name";
      name.textContent = st.name;
      name.dataset.station = st.name;
      name.addEventListener("click", () => { mxSelected = st; paintMatrix(); renderMxDetail(); });
      grid.appendChild(name);
      for (const h of HOURS) {
        const cell = document.createElement("div");
        cell.className = "mx-cell";
        cell.dataset.station = st.name;
        cell.dataset.hour = h;
        cell.addEventListener("mousemove", ev => mxTooltip(ev, st, h));
        cell.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
        cell.addEventListener("click", () => { mxSelected = st; paintMatrix(); renderMxDetail(); });
        grid.appendChild(cell);
      }
    }
  }
  document.getElementById("mxLegendBar").style.background =
    `linear-gradient(to right, ${[0, 0.25, 0.5, 0.75, 1].map(t => mxColor(t)).join(",")})`;
  mxBuilt = true;
}

function paintMatrix() {
  const byName = Object.fromEntries(STATIONS.map(s => [s.name, s]));
  document.querySelectorAll(".mx-cell").forEach(cell => {
    const st = byName[cell.dataset.station];
    const h = Number(cell.dataset.hour);
    const t = mxCellT(st, h);
    cell.style.background = mxColor(t);
    if (mxShowNums) {
      cell.textContent = Math.round(mxCellValue(st, h));
      cell.style.color = t > 0.62 ? "#3a2410" : "#b9bec7";
    } else {
      cell.textContent = "";
    }
  });
  document.querySelectorAll(".mx-name").forEach(el =>
    el.classList.toggle("selected", el.dataset.station === mxSelected.name));
}

function mxTooltip(ev, st, h) {
  tooltip.style.display = "block";
  tooltip.style.position = "fixed";
  tooltip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 190) + "px";
  tooltip.style.top = (ev.clientY + 14) + "px";
  tooltip.innerHTML = `<b>${st.name}</b> ${h}時台<br>` +
    `混雑指数: ${mxIndex(st, h).toFixed(1)}(大阪ピーク=100)<br>` +
    `駅内ピーク比: ${Math.round(mxIndex(st, h) / mxRowMax(st) * 100)}%`;
}

const PROFILE_LABELS = { terminal: "ターミナル", commuter: "通勤", tourist: "観光", nightlife: "繁華街", regional: "地方中核" };

function renderMxDetail() {
  const st = mxSelected;
  const shape = HOURS.map(h => mxIndex(st, h) / mxRowMax(st) * 100);
  const peakH = HOURS[shape.indexOf(Math.max(...shape))];
  const types = Object.entries(st.profile).sort((a, b) => b[1] - a[1])
    .map(([k, w]) => `${PROFILE_LABELS[k]} ${Math.round(w * 100)}%`).join(" / ");

  // 折れ線チャート(SVG): 選択駅 vs 全駅平均(ともにピーク比%)
  const W = 300, H = 170, L = 30, R = 8, T = 12, B = 24;
  const x = h => L + (h - 5) / 19 * (W - L - R);
  const y = v => T + (1 - v / 100) * (H - T - B);
  const path = vals => vals.map((v, i) => `${i ? "L" : "M"}${x(HOURS[i]).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const gridY = [0, 50, 100].map(v =>
    `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2f38" stroke-width="1"/>` +
    `<text x="${L - 5}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="#7c828c">${v}</text>`).join("");
  const gridX = [6, 9, 12, 15, 18, 21, 24].map(h =>
    `<text x="${x(h)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#7c828c">${h}時</text>`).join("");
  const area = `${path(shape)} L${x(24)},${y(0)} L${x(5)},${y(0)} Z`;

  document.getElementById("mxDetail").innerHTML = `
    <h2>${st.name}</h2>
    <p class="meta">${types}</p>
    <div class="stats">
      <div class="stat"><b>${st.passengers.toLocaleString()}</b><span>乗車人員(人/日・概算)</span></div>
      <div class="stat"><b>${peakH}時台</b><span>ピーク時間帯</span></div>
      <div class="stat"><b>${Math.round(mxRowMax(st))}</b><span>ピーク混雑指数</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${st.name}の時間帯別混雑カーブ">
      ${gridY}${gridX}
      <path d="${area}" fill="rgba(232,80,58,0.14)"/>
      <path d="${path(MX_AVG_SHAPE)}" fill="none" stroke="#5b8dd6" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="${path(shape)}" fill="none" stroke="#e8503a" stroke-width="2"/>
      <circle cx="${x(peakH)}" cy="${y(shape[HOURS.indexOf(peakH)])}" r="3.5" fill="#e8503a" stroke="#151920" stroke-width="2"/>
    </svg>
    <div class="chart-legend">
      <span><i style="border-color:#e8503a"></i>${st.name}</span>
      <span><i style="border-color:#5b8dd6; border-top-style:dashed"></i>全駅平均</span>
    </div>
    <p class="mx-note">縦軸は各駅のピーク=100とした比率。時間帯カーブは駅タイプ別の推定モデルです(実測の時間帯別データは大都市交通センサス取込で置換予定)。</p>`;
}

// コントロール
document.getElementById("mxNormRow").addEventListener("click", function () {
  mxNorm = "row";
  this.classList.add("active"); document.getElementById("mxNormAbs").classList.remove("active");
  paintMatrix();
});
document.getElementById("mxNormAbs").addEventListener("click", function () {
  mxNorm = "abs";
  this.classList.add("active"); document.getElementById("mxNormRow").classList.remove("active");
  paintMatrix();
});
document.getElementById("mxNums").addEventListener("change", function () {
  mxShowNums = this.checked; paintMatrix();
});

// ビュー切替
const viewMapBtn = document.getElementById("viewMapBtn");
const viewGraphBtn = document.getElementById("viewGraphBtn");
const matrixView = document.getElementById("matrixView");
function setView(v) {
  const graph = v === "graph";
  matrixView.classList.toggle("active", graph);
  viewGraphBtn.classList.toggle("active", graph);
  viewMapBtn.classList.toggle("active", !graph);
  document.querySelector(".panel").classList.toggle("hidden", graph);
  document.querySelector(".clock").classList.toggle("hidden", graph);
  tooltip.style.display = "none";
  tooltip.style.position = "";
  if (graph) {
    if (playing) setPlaying(false);
    if (!mxBuilt) { buildMatrix(); renderMxDetail(); }
    paintMatrix();
  } else {
    map.resize();
  }
}
viewMapBtn.addEventListener("click", () => setView("map"));
viewGraphBtn.addEventListener("click", () => setView("graph"));

// スクリーンショット・デバッグ用フック
window.__setTime = m => { setPlaying(false); render(m); };
window.__play = () => setPlaying(true);
window.__setMode = (m, d) => { mode = m; if (d) dayType = d; updateModeUI(); applyModePaint(); render(currentMinutes); };
window.__setView = setView;
</script>
</body>
