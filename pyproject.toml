[project]
name = "bleflow"
version = "0.1.0"
description = "ble-flow: BLE パッシブスキャンによる歩行者流動分析基盤(大阪・天神橋1丁目)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "duckdb>=1.1",
    "jinja2>=3.1",
    "numpy>=1.26",
    "polars>=1.10",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.scripts]
bleflow = "bleflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bleflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
