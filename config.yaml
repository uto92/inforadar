# ANA SFC レート検索設定
# ========================
# 大阪（伊丹/関空）発メイン

# 検索する路線リスト
routes:
  # 国内線（伊丹発）
  - origin: ITM           # 伊丹
    destination: HND      # 羽田
  - origin: ITM
    destination: CTS      # 札幌（新千歳）
  - origin: ITM
    destination: OKA      # 沖縄（那覇）
  - origin: ITM
    destination: SDJ      # 仙台
  - origin: ITM
    destination: KMJ      # 熊本
  - origin: ITM
    destination: NGS      # 長崎
  - origin: ITM
    destination: KOJ      # 鹿児島
  - origin: ITM
    destination: ISG      # 石垣島
  - origin: ITM
    destination: MMB      # 女満別
  # 国際線（関空発）
  - origin: KIX
    destination: TPE      # 台北（桃園）

# 検索期間
search:
  # 出発日の範囲（YYYY-MM-DD）
  date_from: "2026-04-01"
  date_to: "2027-01-05"
  # 曜日フィルタ（空の場合は全曜日）
  # weekdays: [fri, sat, sun]
  weekdays: []

# 搭乗クラス
#   国内線: Y(普通席), P(プレミアムクラス) ※プレミアムの特典枠は極少
#   国際線: Y(エコノミー), PY(プレミアムエコノミー), C(ビジネス), F(ファースト)
cabin_classes:
  - Y
  - P

# マイル単価の閾値（円/マイル）
# この値以上のレートが「お得」と判定されます
rate_threshold: 2.0

# リクエスト間隔（秒）- サーバーに負荷をかけないように
request_delay: 3.0

# ANA会員情報（環境変数での設定を推奨）
# ana_credentials:
#   username: ${ANA_USERNAME}
#   password: ${ANA_PASSWORD}
