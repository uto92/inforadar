name = "wester-visit-scanner"
main = "src/index.ts"
compatibility_date = "2025-11-01"

# `wrangler d1 create wester-visit-scanner` の出力にある database_id を
# 下の REPLACE_WITH_D1_DATABASE_ID に貼り付けてからデプロイすること（README参照）
[[d1_databases]]
binding = "DB"
database_name = "wester-visit-scanner"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
enabled = true
